server:
  servlet:
    context-path: /dev-api
  port: 8080

spring:
  datasource:
    # 1. 驱动类（MySQL 8.0+ 必须带 .cj）
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 2. 数据库连接 URL（将 mydb 改为你自己的数据库名，3306 为端口）
    url: jdbc:mysql://localhost:3306/20261012-demo?characterEncoding=UTF-8&serverTimezone=UTC
    # 3. 用户名和密码
    username: root
    password: Localhost-root